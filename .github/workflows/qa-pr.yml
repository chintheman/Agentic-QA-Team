name: qa-pr

# Per-PR confidence loop (spec §6.1, §8).
#
# Design notes that are easy to undo by accident:
#  * `pull_request`, never `push` — one run per PR, not per commit on every branch.
#  * concurrency + cancel-in-progress, or a rapid-fire PR spawns N parallel fleets.
#  * NO `--bare`: it skips hooks, skills and settings — every enforcement
#    mechanism in §5 and §11 — precisely where no human is watching.
#  * Settings are passed explicitly so the G5 guard loads in CI.
#  * Every gate is a separate step that can fail the job on its own.

on:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: write        # §7.4 — .qa/ artifacts must reach the PR
  pull-requests: write

concurrency:
  group: qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  QA_PR: ${{ github.event.pull_request.number }}
  QA_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
  QA_DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref }}

jobs:
  # Is the workflow actually configured to run? Secrets are not readable in a
  # job-level `if`, so the check happens in a step and is published as an output.
  preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY is not set; the QA team cannot run."
          fi
      # Deliberately NOT a PR comment by default.
      #
      # This used to comment on every pull request. On a repository whose owner
      # uses /qa interactively and never intends to set the secret, that is a
      # recurring notice about a decision already made — and a bot that says the
      # same thing forever is one people mute, along with whatever it says next.
      #
      # The information still exists: it goes to the job summary and an
      # annotation, both visible in the Actions tab. Opt into the comment by
      # adding the `qa` label to a pull request.
      - name: Record the gap where it does not nag
        if: steps.check.outputs.configured == 'false'
        run: |
          {
            echo "### QA not run (not configured)"
            echo
            echo '`ANTHROPIC_API_KEY` is not set, so the QA team cannot run here.'
            echo "**No Confidence Report exists for this change** — treat it as unreviewed"
            echo "by the QA team, not as a pass."
            echo
            echo "This is not a failure. Interactive use (\`/qa\` in Claude Code) needs no"
            echo "secret; the secret only lets a GitHub runner, which is not signed in as"
            echo "you, run the same checks unattended."
            echo
            echo "To enable: Settings → Secrets and variables → Actions → \`ANTHROPIC_API_KEY\`."
            echo "To get this as a PR comment instead, add the \`qa\` label."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment only when explicitly asked
        if: steps.check.outputs.configured == 'false' && contains(github.event.pull_request.labels.*.name, 'qa')
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- qa-not-configured -->';
            const existing = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            if (existing.data.some(c => c.body && c.body.includes(marker))) return;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body: [
                marker,
                '### QA not run (not configured)',
                '',
                '`ANTHROPIC_API_KEY` is not set as a repository secret, so the QA team',
                'cannot run. **No Confidence Report exists for this change** — treat it as',
                'unreviewed by the QA team, not as a pass.',
                '',
                'To enable: **Settings → Secrets and variables → Actions → New repository secret**,',
                'named `ANTHROPIC_API_KEY`.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n')
            })

  # Fork PRs get a read-only token and no secrets, so the workflow cannot run.
  # §7.4 requires an explicit decision rather than silent failure: we skip, and
  # say so in the PR so the absence of a report is never mistaken for a pass.
  fork-notice:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body: [
                '### QA not run (fork PR)',
                '',
                'Fork pull requests receive a read-only token and no secrets, so the',
                'agentic QA workflow cannot run. **No Confidence Report exists for this',
                'change** — treat it as unreviewed by the QA team, not as a pass.',
                '',
                'A maintainer can re-run the suite by pushing this branch to the main',
                'repository.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n')
            })

  risk:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      band: ${{ steps.band.outputs.band }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }     # merge-base needs real history
      - uses: actions/cache@v4
        with:
          path: .qa/metrics/history.json
          key: qa-history-${{ github.event.pull_request.base.sha }}
          restore-keys: qa-history-
      - name: Ensure history exists
        run: python3 scripts/qa-history.py || true
      - id: scout
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/qa-risk ${{ github.event.pull_request.number }}"
          claude_args: >-
            --settings .claude/qa-ci-settings.json
            --agent risk-scout
            --max-turns 10
            --model claude-haiku-4-5-20251001
            --permission-mode dontAsk
            --max-budget-usd 0.50
            --output-format json
            --tools "Read,Grep,Glob,Bash,Write"
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git status:*),Write"
      - id: band
        run: |
          band=$(jq -r '.band // "medium"' .qa/risk/${QA_PR}.json 2>/dev/null || echo medium)
          echo "band=$band" >> "$GITHUB_OUTPUT"
          echo "Risk band: $band"
      # The confidence job checks out fresh and would not otherwise see this.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-risk-${{ github.event.pull_request.number }}
          path: .qa/risk/
          if-no-files-found: warn

  # medium+ : the confidence loop. Gates run as their own steps so each can fail
  # the job independently — a hook gives the agent fast feedback, but the CI step
  # is what actually blocks.
  confidence:
    needs: [preflight, risk]
    if: needs.preflight.outputs.configured == 'true' && needs.risk.outputs.band != 'low'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Passed explicitly so G6 never has to guess the band from a file that a
      # different job wrote into a different checkout.
      QA_BAND: ${{ needs.risk.outputs.band }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/download-artifact@v4
        with:
          name: qa-risk-${{ github.event.pull_request.number }}
          path: .qa/risk/
        continue-on-error: true

      - name: Budget check before oracle
        run: .qa/gates/g6-budget.sh check spec-oracle 2.00

      - name: spec-oracle
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/qa-oracle ${{ github.event.pull_request.number }}"
          claude_args: >-
            --settings .claude/qa-ci-settings.json
            --agent spec-oracle
            --max-turns 20 --model claude-opus-4-5 --effort high
            --permission-mode dontAsk --max-budget-usd 3.00 --output-format json
            --tools "Read,Grep,Glob,WebFetch,Write"

      - name: G7 — oracle completeness
        run: .qa/gates/g7-completeness.sh oracle "${{ needs.risk.outputs.band }}" ".qa/oracles/${QA_PR}.md"

      - name: Budget check before unit-smith
        run: .qa/gates/g6-budget.sh check unit-smith 4.00

      - name: unit-smith
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/qa-test changed files for PR ${{ github.event.pull_request.number }}"
          claude_args: >-
            --settings .claude/qa-ci-settings.json
            --agent unit-smith
            --max-turns 30 --model claude-sonnet-4-5 --effort high
            --permission-mode dontAsk --max-budget-usd 5.00 --output-format json
            --tools "Read,Grep,Glob,Write,Edit,Bash"

      # --- the gates. Order matters: cheap and certain first. ---------------
      - name: G3 — vacuity
        run: .qa/gates/g3-vacuity.sh

      - name: G4 — snapshot laundering
        run: .qa/gates/g4-snapshot.sh

      - name: G2 — mutation (scoped, capped, once)
        run: .qa/gates/g2-mutation.sh

      - name: G8 — route coverage
        run: .qa/gates/g8-route-coverage.sh

      - name: release-marshal
        if: always()      # a failed gate is evidence; the report must still be written
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/qa-verdict ${{ github.event.pull_request.number }}"
          claude_args: >-
            --settings .claude/qa-ci-settings.json
            --agent release-marshal
            --max-turns 20 --model claude-opus-4-5 --effort high
            --permission-mode dontAsk --max-budget-usd 2.00 --output-format json
            --tools "Read,Grep,Glob,Write"

      - name: G7 — marshal completeness
        if: always()
        run: .qa/gates/g7-completeness.sh marshal "${{ needs.risk.outputs.band }}" ".qa/reports/${QA_PR}.json"

      - name: Persist .qa artifacts to the PR branch
        if: always()
        run: |
          git config user.name "qa-team[bot]"
          git config user.email "qa-team@users.noreply.github.com"
          git add .qa/ || true
          git diff --staged --quiet || git commit -m "chore(qa): artifacts for PR #${QA_PR}"
          git push origin HEAD:${{ github.event.pull_request.head.ref }} || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-artifacts-${{ github.event.pull_request.number }}
          path: .qa/
