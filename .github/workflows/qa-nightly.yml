name: qa-nightly

# The nightly sweep (spec §6.3).
#
# The PR loop tells you a change is safe. The nightly sweep tells you the SYSTEM
# is safe — that is where the proactive value lives.

on:
  schedule:
    # Two slots. The primary does the sweep; the retry slot does the work only
    # if the primary could not.
    #
    # Why a retry slot exists: these sessions authenticate with the *subscription*
    # token, which is capped by a rolling 5-hour window shared with the owner's
    # local Claude Code use. When that window is exhausted the API rejects every
    # session instantly — 429, one turn, $0, ~0.5s — so the whole sweep dies
    # before it runs. The sessions now defer on that (see the gate step) and this
    # slot picks the sweep up once the window has rolled over. In practice both
    # fire several hours after their nominal time; the retry lands after
    # midnight SGT, when the window is normally clear.
    - cron: "0 2 * * *"       # primary — after qa-history
    - cron: "0 12 * * *"      # retry — if the primary deferred
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read           # the retry slot reads this workflow's own run history

jobs:
  # A deferred primary must not talk the retry slot out of its work, and a real
  # primary must not be repeated. A real sweep takes 10-14 minutes; a run that
  # deferred — or that died before the sessions could work — finishes in well
  # under one. Duration is what separates "the sweep happened" from "the slot
  # opened and shut", and it survives the gate's exit code staying green.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — running the sweep."
            exit 0
          fi
          today=$(date -u +%Y-%m-%dT00:00:00Z)
          # Unreadable history must not silently cancel the sweep: any failure
          # here leaves run=true.
          real=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/qa-nightly.yml/runs?status=success&per_page=30" \
            --jq "[.workflow_runs[]
                   | select(.created_at >= \"$today\")
                   | select(((.updated_at | fromdate) - (.run_started_at | fromdate)) > 300)]
                  | length" 2>/dev/null || echo 0)
          if [ "${real:-0}" -gt 0 ] 2>/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A sweep already completed today ($real run(s) over 5 minutes) — this slot is redundant."
          else
            echo "No completed sweep today — running."
          fi

  sweep:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QA_PR: nightly
      QA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Which cron fired this run decides whether a rate-limited sweep may
      # defer (primary) or must be reported (fallback): if the retry slot is
      # also locked out, the nightly analysis has not happened at all.
      QA_SLOT: ${{ github.event.schedule == '0 12 * * *' && 'fallback' || 'primary' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Fail in seconds with a named cause rather than burning three agent
      # steps on an empty credential. The action only errors out *inside* the
      # SDK, which reads as a generic step failure.
      - name: Preflight — required secret is present
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$OAUTH" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN is not set on this repo. Generate one with 'claude setup-token' and run: gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi
          echo "CLAUDE_CODE_OAUTH_TOKEN present (${#OAUTH} chars)"

      - name: Confirm history is fresh
        run: |
          # risk-scout and the charter prioritisation both read this. If it is
          # stale the sweep still runs, but say so rather than quietly using
          # month-old churn data.
          gen=$(jq -r '.generated // "never"' .qa/metrics/history.json 2>/dev/null || echo never)
          echo "history.json generated: $gen"
          [ "$gen" = "$(date -u +%Y-%m-%d)" ] || echo "::warning::history.json is not from today ($gen)"

      # The three sessions are independent. One dying must not discard the work
      # the other two already paid for — so they continue-on-error and the job
      # verdict is decided by the gate step at the end.
      -
        name: flake-warden — 30-day analysis, quarantine, pruning
        id: flake_warden
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "Run the nightly flake analysis: 30-day flake rate, quarantine expiry, suite pruning candidates, and promote any real intermittent bug to .qa/bugs/."
          claude_args: >-
            --settings .claude/qa-ci-settings.json
            --agent flake-warden
            --max-turns 60 --model claude-sonnet-4-5
            --permission-mode dontAsk --max-budget-usd 6.00
            --tools "Read,Grep,Glob,Write,Bash"
      # The action writes every session's transcript to one fixed path
      # ($RUNNER_TEMP/claude-execution-output.json) and overwrites it, so each
      # one is copied out before the next session can clobber it. The gate
      # reads these copies to tell a rate-limited session from a broken one.
      -
        name: Capture flake-warden log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/qa-results"
          src='${{ steps.flake_warden.outputs.execution_file }}'
          if [ -n "$src" ] && [ -f "$src" ]; then
            cp "$src" "$RUNNER_TEMP/qa-results/flake-warden.json"
          else
            echo "no execution log published for flake-warden"
          fi

      # Three sessions, prioritised by risk x inverse mutation score.
      -
        name: prober — exploratory sessions
        id: prober
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "Run 3 exploratory sessions from .qa/charters/backlog.md, prioritised by risk x inverse mutation score. One charter per session."
          claude_args: >-
            --settings .claude/qa-ci-settings.json
            --agent prober
            --max-turns 60 --model claude-sonnet-4-5
            --permission-mode dontAsk --max-budget-usd 12.00
            --tools "Read,Grep,Glob,Write,Bash"
      -
        name: Capture prober log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/qa-results"
          src='${{ steps.prober.outputs.execution_file }}'
          if [ -n "$src" ] && [ -f "$src" ]; then
            cp "$src" "$RUNNER_TEMP/qa-results/prober.json"
          else
            echo "no execution log published for prober"
          fi

      # One module per night, not a sweep — depth beats breadth here.
      # show_full_output stays until the is_error:true seen in run 32549823920
      # (21 turns, $0.23, no billing error) has an identified cause.
      -
        name: unit-smith — harden the weakest high-risk module
        id: unit_smith
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: true
          prompt: "Identify the single lowest-mutation-score high-risk module and run the mutation loop on it. One module only."
          claude_args: >-
            --settings .claude/qa-ci-settings.json
            --agent unit-smith
            --max-turns 60 --model claude-sonnet-4-5
            --permission-mode dontAsk --max-budget-usd 8.00
            --tools "Read,Grep,Glob,Write,Edit,Bash"
      -
        name: Capture unit-smith log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/qa-results"
          src='${{ steps.unit_smith.outputs.execution_file }}'
          if [ -n "$src" ] && [ -f "$src" ]; then
            cp "$src" "$RUNNER_TEMP/qa-results/unit-smith.json"
          else
            echo "no execution log published for unit-smith"
          fi

      - name: Compact per-PR metrics into the rolling corpus
        if: always()
        run: python3 scripts/qa-compact-metrics.py || true

      - name: Open a PR only if something warrants attention
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "qa-team[bot]"
          git config user.email "qa-team@users.noreply.github.com"
          # git diff is blind to untracked files, and a new .qa/bugs/ entry is
          # the single most common thing this sweep produces. Use status.
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to report"; exit 0
          fi
          branch="qa/nightly-$(date -u +%Y%m%d)-${{ github.run_number }}"
          git checkout -b "$branch"
          git add -A && git commit -m "chore(qa): nightly sweep $(date -u +%Y-%m-%d)"
          git push -u origin "$branch"
          # Heredoc, not an inline quoted string: indented continuation
          # lines would otherwise render the table as a code block.
          cat > /tmp/pr-body.md <<EOF
          Automated nightly sweep.

          | session | outcome |
          | --- | --- |
          | flake-warden | ${{ steps.flake_warden.outcome }} |
          | prober | ${{ steps.prober.outcome }} |
          | unit-smith | ${{ steps.unit_smith.outcome }} |

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          gh pr create \
            --base "$QA_DEFAULT_BRANCH" \
            --head "$branch" \
            --title "chore(qa): nightly sweep $(date -u +%Y-%m-%d)" \
            --body-file /tmp/pr-body.md

      # Partial results are salvaged above; the job still goes red so a failing
      # session cannot hide behind a green nightly. The one exception is a
      # sweep locked out by the subscription window at the primary slot: that
      # is transient, no verdict was reached, and the retry slot re-runs it —
      # so it defers out loud instead of failing. See scripts/qa-nightly-gate.py.
      - name: Gate — decide the verdict from the sessions' own logs
        if: always()
        env:
          QA_OUTCOMES: flake-warden=${{ steps.flake_warden.outcome }},prober=${{ steps.prober.outcome }},unit-smith=${{ steps.unit_smith.outcome }}
          QA_RESULTS: ${{ runner.temp }}/qa-results
          QA_ANNOTATE: "1"
        run: python3 scripts/qa-nightly-gate.py
