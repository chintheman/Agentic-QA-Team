# Separation-of-duties policy (spec §4 P4, enforced by G5).
#
# This file IS the P4 table. The guard hook reads it on every PreToolUse call
# and adjudicates by the calling agent's `agent_type`.
#
# Semantics:
#   write_allow  — glob patterns this agent may create/modify. Empty list means
#                  the agent may not write at all.
#   read_allow   — if present, the agent may read ONLY these. Allow-list beats
#                  deny-list here: a deny-list of directory names silently
#                  fails open in any repo that names things differently.
#   read_deny    — patterns this agent may NOT read, via ANY content-returning
#                  tool (Read, Grep, Glob, WebFetch). §7.2 exists because
#                  blocking Read alone is not enough.
#   url_deny     — substrings that, if present in a WebFetch URL, are blocked.
#   bash_deny    — regexes matched against the full Bash command.
#
# An agent_type absent from this file is DENIED any write. Fail closed: an
# unknown agent is an unreviewed agent.

defaults:
  # Snapshot laundering (P8/G4). Every pattern is anchored to a TEST RUNNER.
  #
  # A bare `-u` lived here originally and it was a disaster: it blocked
  # `git push -u`, `sort -u` and `pip install -U`, none of which have anything
  # to do with snapshots. A gate that fires on innocent commands trains people
  # to route around it, and a gate people route around is worse than no gate.
  # Precision here is a credibility requirement, not a nicety.
  bash_deny:
    - '\b(jest|vitest)\b[^|;]*\s(-u|--update|--updateSnapshot)(\s|$)'
    - '\bplaywright\b[^|;]*--update-snapshots'
    - '\bpytest\b[^|;]*--snapshot-update'
    - '\bcargo\s+insta\s+accept\b'
    - '\bava\b[^|;]*--update-snapshots'

  # Editing the referee is enforced on the tool's TARGET PATH, below — never by
  # matching command text. Text matching blocked reading, grepping and even
  # *running* the gates, which is the one thing they exist for.
  #
  # Only the guard itself is immutable to everyone.
  write_deny_always:
    - ".qa/policy.yaml"
    - ".claude/hooks/**"

  # Immutable to AGENTS, editable by the orchestrator. Redundant in practice —
  # agents are already confined by their write_allow lists and none of these
  # appear there — but kept explicit so the intent survives an edit to the
  # allow-lists. Read by the guard only once it supports this key.
  agent_write_deny:
    - ".qa/gates/**"
    - ".qa/RISK-RULES.yaml"
    - ".claude/qa-settings/**"
    - ".github/workflows/**"

agents:

  # --- Analysts: may write only their own .qa/ subdirectory -----------------
  risk-scout:
    write_allow: [".qa/risk/**"]

  spec-oracle:
    write_allow: [".qa/oracles/**"]
    # P2 — the reason this agent exists as a separate process.
    #
    # Two deny-lists, because each one's blind spot is the other's coverage:
    #
    #   EXTENSIONS catch an unfamiliar layout. The original version listed only
    #   src/, lib/ and app/, so a repository keeping code in index/ or parser/
    #   let the oracle read the implementation while the report still asserted
    #   blindness — fail-open, and indistinguishable from working until audited.
    #
    #   DIRECTORIES catch search arguments. A Grep or Glob is often given a
    #   directory pattern ("src/**") rather than a filename, which no extension
    #   pattern matches. Dropping these was a regression the self-test caught.
    #
    # Neither list alone is sufficient. Keep both.
    read_allow:
      - "README*"
      - "docs/**"
      - "doc/**"
      - "**/*.md"
      - "openapi.*"
      - "swagger.*"
      - "**/*.graphql"
      - "**/schema.json"
      - ".qa/oracles/**"
      - ".qa/charters/**"
    read_deny:
      # By extension — survives a layout this list has never seen.
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.go"
      - "**/*.rs"
      - "**/*.java"
      - "**/*.rb"
      - "**/*.php"
      - "**/*.cs"
      - "**/*.sql"
      - "**/*.diff"
      - "**/*.patch"
      # By directory — catches Grep/Glob patterns, which name folders not files.
      - "src/**"
      - "lib/**"
      - "app/**"
      - "index/**"
      - "parser/**"
      - "scraper/**"
      - "core/**"
      - "internal/**"
      - "packages/**"
      - "tests/**"
      - "test/**"
      - "spec/**"
      - ".qa/risk/**"
      # Markdown stays readable on purpose: ARCHITECTURE.md and METHODOLOGY.md
      # are specifications, which is exactly what this agent is supposed to read.
    url_deny:
      - "/pull/"
      - "/commit/"
      - "/compare/"
      - ".diff"
      - ".patch"
      - "/blob/"
      - "/raw/"
    bash_deny:
      - '^\s*git\s+(diff|show|log|blame)'
      - '^\s*(cat|head|tail|sed|awk|less)\b'

  prober:
    # Writes findings only. Never tests, never source (§3.8).
    write_allow: [".qa/sessions/**", ".qa/bugs/**", ".qa/charters/**", ".qa/artifacts/**"]

  authz-prober:
    write_allow: [".qa/authz-matrix.yaml", ".qa/bugs/**", ".qa/reports/authz-**"]

  # --- Test authors: tests and their own reports; never source (P4) ---------
  unit-smith:
    write_allow: ["tests/**", "test/**", "**/*.test.*", "**/*.spec.*", "spec/**",
                  ".qa/reports/unit-smith-**", ".qa/disputes/**"]

  flow-smith:
    write_allow: ["tests/**", "e2e/**", "**/*.spec.ts", ".qa/plans/**",
                  ".qa/reports/flow-smith-**", ".qa/artifacts/**"]

  # --- Fixer: source only; explicitly NOT tests (P4) ------------------------
  # The single most important row. The dominant path to a meaningless test is:
  # agent writes test -> test fails -> same agent "fixes" it by loosening the
  # assertion. patch-smith cannot touch a test at all.
  patch-smith:
    write_allow: ["src/**", "lib/**", "app/**", "packages/*/src/**",
                  # Repos that do not use src/. Without these patch-smith can
                  # write nothing, and an agent that cannot do its job lobbies
                  # to have the constraint removed — §7.1's predicted failure.
                  "index/**", "parser/**", "scraper/**", "core/**", "internal/**",
                  "*.py", "*.ts", "*.js"]
    write_deny:
      - "tests/**"
      - "test/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/conftest.py"
      - ".qa/reports/**"
    # P7: no retrieving the answer. No history mining, no upstream lookup.
    bash_deny:
      - '^\s*git\s+(log|show|blame|fetch|pull)'
      - '^\s*(curl|wget)\b'
    url_deny: ["github.com", "gitlab.com", "stackoverflow.com"]

  # --- Build cop ------------------------------------------------------------
  flake-warden:
    write_allow: [".qa/flakes.json", ".qa/reports/nightly-**", ".qa/quarantine.yaml"]

  # --- Marshal: reports only. No code, ever. --------------------------------
  release-marshal:
    write_allow: [".qa/reports/**", ".qa/metrics/verdicts/**"]
